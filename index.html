<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Favoritos de Trabalho</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#2563eb;--danger:#dc2626;--border:#e5e7eb;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#111827;color:#fff;padding:28px 18px 32px} .top{max-width:1000px;margin:auto}
.back{display:inline-block;color:#cbd5e1;text-decoration:none;font-size:14px;margin-bottom:18px}.back:hover{color:#fff}
h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#cbd5e1}
main{max-width:1000px;margin:-12px auto 40px;padding:0 14px}
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap}
input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;background:#fff;color:var(--text)}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-wrap{display:flex;flex:1;min-width:220px;gap:6px}.search-wrap .search{flex:1;min-width:0}.search-btn{width:46px;padding:0;font-size:18px}.icon-action{width:46px;padding:0;font-size:18px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:600;cursor:pointer;font-size:14px}
.primary{background:var(--primary);color:#fff}.secondary{background:#eef2ff;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#f3f4f6;color:#374151}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px;margin-top:18px}
.card{width:100%;max-width:100%;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.05);display:flex;flex-direction:row;align-items:center;min-height:0;height:58px;padding:8px 10px;cursor:grab;transition:.18s}.card.dragging{opacity:.45;cursor:grabbing}.card.drag-over{border:2px dashed var(--primary);transform:scale(1.01)}
.card-main{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;min-width:0;flex:1;overflow:hidden}.icon{width:30px;height:30px;min-width:30px;border-radius:8px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-weight:800;margin:0}
.card h2{font-size:15px;line-height:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.card-main > div:not(.icon){min-width:0;flex:1}.actions{display:flex;gap:4px;margin:0 0 0 8px;justify-content:flex-end;align-items:center;flex-shrink:0}.actions button{flex:0 0 auto;width:28px;height:26px;padding:0;border-radius:7px;font-size:15px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:45px 15px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.open{display:flex}.dialog{background:#fff;border-radius:18px;width:min(520px,100%);padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.dialog h2{margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.note{font-size:12px;color:var(--muted);margin:15px 2px 0}
@media(max-width:600px){h1{font-size:25px}.grid{grid-template-columns:1fr}.toolbar{padding:12px}}
</style>
</head>
<body>
<header><div class="top">
<a class="back" href="../portfolio.html">← Voltar ao portfólio</a>
<h1>Favoritos de Trabalho</h1>
<p>Acesso rápido às páginas que você usa no trabalho.</p>
</div></header>

<main>
<section class="toolbar">
<div class="search-wrap">
<input id="search" class="search" type="search" placeholder="Pesquisar favorito...">
<button class="secondary search-btn" onclick="pesquisar()" title="Pesquisar" aria-label="Pesquisar">🔎</button>
</div>
<button class="primary icon-action" onclick="openModal()" title="Novo favorito" aria-label="Novo favorito">➕</button>
<button class="secondary" onclick="exportar()">Exportar</button>
<button class="ghost" onclick="document.getElementById('importFile').click()">Importar</button>
<input id="importFile" type="file" accept=".json,application/json" hidden onchange="importar(event)">
</section>
<p class="note">Os favoritos ficam salvos neste navegador. Você pode adicionar, editar, excluir e também exportar/importar sua lista.</p>
<section id="grid" class="grid"></section>
</main>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="dialog">
<h2 id="modalTitle">Novo favorito</h2>
<div class="field"><label for="nome">Nome</label><input id="nome" placeholder="Ex.: OGMO-ES Intranet"></div>
<div class="field"><label for="url">Endereço do site</label><input id="url" type="url" placeholder="https://exemplo.com.br/intranet"></div>
<div class="dialog-actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="salvar()">Salvar favorito</button></div>
</div>
</div>

<script>
const STORAGE_KEY='trabalho_favoritos_v2';
const DEFAULTS=[
 {id:'ogmo-intranet',nome:'OGMO-ES — Intranet',url:'https://www.ogmoes.com.br/intranet'},
 {id:'ogmo-mobile',nome:'OGMO-ES — Mobile',url:'https://www.ogmoes.com.br/mobile'},
 {id:'praticagem-manobras',nome:'Praticagem — Manobras Previstas',url:'https://www.praticagem.org/manobrasprevistas'}
];
let favoritos=carregar(), editando=null, dragId=null;

function carregar(){
 try{
  const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
  if(Array.isArray(x)) return x;
  const antigo=JSON.parse(localStorage.getItem('trabalho_favoritos_v1'));
  return Array.isArray(antigo)?antigo:DEFAULTS.map(x=>({...x}));
 }catch(e){return DEFAULTS.map(x=>({...x}))}
}
function persistir(){localStorage.setItem(STORAGE_KEY,JSON.stringify(favoritos))}
function inicializar(){persistir();renderizar()}
function normalizarUrl(u){u=u.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function pesquisar(){document.getElementById('search').focus();renderizar()}
function renderizar(){
 const termo=document.getElementById('search').value.toLowerCase().trim();
 const lista=favoritos.filter(x=>(x.nome+' '+x.url).toLowerCase().includes(termo));
 const grid=document.getElementById('grid');
 if(!lista.length){grid.innerHTML='<div class="empty">Nenhum favorito encontrado.<br>Use <b>+ Novo favorito</b> para adicionar um site.</div>';return}
 grid.innerHTML=lista.map(x=>`
 <article class="card" draggable="true" data-id="${x.id}">
  <a class="card-main" href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">
   <div class="icon">${escapeHtml(x.nome.charAt(0).toUpperCase())}</div>
   <div><h2>${escapeHtml(x.nome)}</h2>
   <div class="url">${escapeHtml(x.url)}</div></div>
  </a>
  <div class="actions">
   <button class="secondary" title="Editar" aria-label="Editar" onclick="editar('${x.id}')">✏️</button>
   <button class="danger" title="Excluir" aria-label="Excluir" onclick="excluir('${x.id}')">🗑️</button>
  </div>
 </article>`).join('');
 bindDrag();
}
function bindDrag(){
 document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
  card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));dragId=null});
  card.addEventListener('dragover',e=>{e.preventDefault();if(dragId&&dragId!==card.dataset.id)card.classList.add('drag-over')});
  card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
  card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');if(!dragId||dragId===card.dataset.id)return;reordenar(dragId,card.dataset.id)});
 });
}
function reordenar(fromId,toId){
 const from=favoritos.findIndex(x=>x.id===fromId), to=favoritos.findIndex(x=>x.id===toId);
 if(from<0||to<0)return;
 const [item]=favoritos.splice(from,1);favoritos.splice(to,0,item);persistir();renderizar();
}
function openModal(id=null){
 editando=id;
 document.getElementById('modalTitle').textContent=id?'Editar favorito':'Novo favorito';
 const item=favoritos.find(x=>x.id===id);
 document.getElementById('nome').value=item?.nome||'';
 document.getElementById('url').value=item?.url||'';
 document.getElementById('modal').classList.add('open');
 setTimeout(()=>document.getElementById('nome').focus(),50);
}
function closeModal(){document.getElementById('modal').classList.remove('open');editando=null}
function salvar(){
 const nome=document.getElementById('nome').value.trim(), raw=document.getElementById('url').value.trim();
 if(!nome||!raw){alert('Preencha o nome e o endereço do site.');return}
 const url=normalizarUrl(raw);
 try{new URL(url)}catch(e){alert('Digite um endereço válido.');return}
 if(editando){const i=favoritos.findIndex(x=>x.id===editando);favoritos[i]={...favoritos[i],nome,url}}
 else{favoritos.push({id:crypto.randomUUID(),nome,url})}
 persistir();renderizar();closeModal();
}
function editar(id){openModal(id)}
function excluir(id){
 const item=favoritos.find(x=>x.id===id);if(!item)return;
 if(confirm('Excluir o favorito “'+item.nome+'”?')){favoritos=favoritos.filter(x=>x.id!==id);persistir();renderizar()}
}
function exportar(){
 const blob=new Blob([JSON.stringify(favoritos,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='favoritos-trabalho.json';a.click();URL.revokeObjectURL(a.href)
}
function importar(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{
  const data=JSON.parse(reader.result);
  if(!Array.isArray(data)||data.some(x=>!x.nome||!x.url))throw new Error();
  favoritos=data.map(x=>({id:x.id||crypto.randomUUID(),nome:String(x.nome),url:normalizarUrl(String(x.url))}));
  persistir();renderizar();alert('Favoritos importados com sucesso.');
 }catch(e){alert('Arquivo inválido. Use um JSON exportado por esta página.')}event.target.value='';
 };reader.readAsText(file)
}
document.getElementById('search').addEventListener('input',renderizar);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
inicializar();
</script>
</body>
</html>
